StylesPath = styles
MinAlertLevel = warning

# Severity follows the document's role, which is as close to IEEE's
# requirement/narrative split as a per-sentence linter can get. REQUIREMENTS.md
# is requirements throughout, so a deprecated modal there is an error.
# SPEC.md carries design rationale alongside its requirements, and IEEE permits
# `must` for unavoidable situations and `will` for statements of fact — the
# cases rationale is made of. Warning, not error, so narrative is not forced
# into a rephrasing the standard does not ask for (§spec:prose-lint-severity).

[REQUIREMENTS.md]
BasedOnStyles = Requirements
Requirements.WillDeprecated = error

[SPEC.md]
BasedOnStyles = Requirements
Requirements.MustDeprecated = warning
