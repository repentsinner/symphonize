StylesPath = styles
MinAlertLevel = warning

# The modal rules check requirements, and a requirement is a list item in
# REQUIREMENTS.md. Prose there keeps IEEE's allowance for `must` (an unavoidable
# situation) and `will` (a statement of fact). SPEC.md is declarative, so it
# carries no modal rules (§spec:prose-lint-severity).

# Each section also matches a nested file, so a package governance root is
# linted when Vale runs from the repository root.

[{REQUIREMENTS.md,**/REQUIREMENTS.md}]
BasedOnStyles = Requirements

[{SPEC.md,**/SPEC.md}]
BasedOnStyles = Requirements
Requirements.MustDeprecated = NO
Requirements.WillDeprecated = NO
