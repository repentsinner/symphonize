name: Governance Lint

# A thin caller. Every check lives in the notation plugin's bundled
# governance-lint script, which /notation:lint and the pre-commit hook run too
# — one implementation, so local and CI cannot drift (SPEC §spec:governance-lint).
#
# This file provisions the tools the script orchestrates and nothing else. It
# stays thin on purpose: it sits outside every release-please package path, so
# a change here cuts no release and never reaches an adopter pinned to a
# floating tag. Check logic belongs in plugins/notation/, which does release.

on:
  workflow_call:
    inputs:
      readme-type:
        description: >
          README heading validation profile: "library", "application", or ""
          (empty string skips validation). Default is "" for backward compat.
        required: false
        type: string
        default: ""

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the caller's repository
        uses: actions/checkout@v7

      # The script has to match the workflow the adopter pinned, or a caller on
      # an old tag would run today's contract rather than that tag's.
      #
      # `github.job_workflow_sha` is not a real property. It is absent from the
      # github context (actions/runner#2417), so the expression that named it
      # always fell through to `github.sha`. In this repository that is
      # harmless — github.sha is a symphonize commit — but cross-repo it asks
      # symphonize for the *caller's* commit, and the checkout dies with
      # "upload-pack: not our ref". The job context carries the real values.
      - name: Resolve the notation contract ref
        id: contract
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          echo "workflow repository: ${WF_REPO:-<empty>}"
          echo "workflow sha:        ${WF_SHA:-<empty>}"
          # Fail loudly rather than falling back to something plausible. A
          # fallback is what hid the previous defect: it kept this repository's
          # own CI green while every adopter's job died.
          if [ -z "$WF_REPO" ] || [ -z "$WF_SHA" ]; then
            echo "::error::job.workflow_repository / job.workflow_sha are unavailable;" \
                 "cannot resolve the pinned notation contract"
            exit 1
          fi
          {
            echo "repository=${WF_REPO}"
            echo "sha=${WF_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the notation contract
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.contract.outputs.repository }}
          ref: ${{ steps.contract.outputs.sha }}
          path: .notation-contract

      # actions/checkout refuses a path outside the workspace, so the contract
      # lands in the tree being linted and the script counts its governance
      # files as a second copy of the caller's — every slug duplicated, every
      # reference ambiguous. Move it out before anything walks the tree; the
      # workspace the script sees is then exactly the caller's repository.
      - name: Move the contract out of the linted tree
        run: mv .notation-contract "$RUNNER_TEMP/notation-contract"

      # Pinned binary, fetched directly. vale-cli/vale-action@v3's reviewdog
      # bridge crashes with EPIPE on the Node 24 runner image even with zero
      # findings; the binary's exit code is the whole gate.
      - name: Install Vale
        if: hashFiles('.vale.ini') != ''
        env:
          VALE_VERSION: "3.17.1"
        run: |
          curl -sfLo "$RUNNER_TEMP/vale.tar.gz" \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Pinned binary, same reasoning as Vale above. Installing rumdl here is
      # what keeps CI and a developer's machine on one engine: the script
      # prefers rumdl and would otherwise fall back to the runner's
      # preinstalled npx markdownlint-cli2, which is a different linter.
      - name: Install rumdl
        env:
          RUMDL_VERSION: "0.2.62"
        run: |
          curl -sfLo "$RUNNER_TEMP/rumdl.tar.gz" \
            "https://github.com/rvben/rumdl/releases/download/v${RUMDL_VERSION}/rumdl-v${RUMDL_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf "$RUNNER_TEMP/rumdl.tar.gz" -C "$RUNNER_TEMP" rumdl
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run the governance contract
        run: |
          "$RUNNER_TEMP/notation-contract/plugins/notation/scripts/governance-lint.sh" \
            --readme-type "${README_TYPE}" \
            --require-tools
        env:
          README_TYPE: ${{ inputs.readme-type }}
